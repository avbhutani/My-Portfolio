    <!--
      Runs before first paint. Resolves the theme so the page never flashes the
      wrong colour scheme, and marks the document as scripted so scroll-reveal
      styles only hide content when something is there to reveal it again.
      Mirrors the logic in src/hooks/useTheme.js.
    -->
    <script>
      document.documentElement.classList.add('js');
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersLight ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'light' ? '#ffffff' : '#0a0d14');
        } catch (e) {
          /* keep the default dark theme */
        }
      })();
    </script>
